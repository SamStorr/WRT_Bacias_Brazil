<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brazil River Basins Map</title>

  <!-- Leaflet CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" 
  />
  <style>
    /* Ensure the container or iframe expands correctly */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: "Work Sans", sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh; /* Full viewport height */
    }

    /* Style for tooltips and info boxes */
    .info-tooltip {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 1.2em;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    // 1. Initialize map centered over Brazil
    const map = L.map('map').setView([-14.2350, -51.9253], 4);

    // 2. Add base tile layer 
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);


    
    // 3. Define styling for the river basins
    function defaultStyle(feature) {
      return {
        fillColor: '#1A69B2', // Soft water blue
        weight: 1.5,
        opacity: 0.8,
        color: '#1A69B2',     // Border color
        fillOpacity: 0.45
      };
    }

    // Highlight style on mouseover
    function highlightStyle() {
      return {
        fillColor: '#29ABE3',
        weight: 2.5,
        color: '#29ABE3',
        fillOpacity: 0.7
      };
    }

    // 4. Load external GeoJSON file
    fetch('./limites_bacias.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Failed to load GeoJSON file: ' + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        const geojsonLayer = L.geoJSON(data, {
          style: defaultStyle,
          onEachFeature: function (feature, layer) {
            const props = feature.properties || {};
          
            // Extract properties (adjust casing to match your exact GeoJSON keys if needed)
            const name = props.NAME || props.nome || props.name || 'River Basin';
            const population = props.Population || props.population || props.POPULATION || 'N/A';
            const municipalities = props.Municipalities || props.municipalities || props.MUNICIPALITIES || 'N/A';
          
            // Build multi-line HTML tooltip content
            const tooltipContent = `
              <div>
                <span style="font-size: 1.4em"><strong>${name}</strong></span><br/>
                <strong>Population:</strong> ${population}<br/>
                <strong>Municipalities:</strong> ${municipalities}
              </div>
            `;
          
            // Bind the formatted tooltip
            layer.bindTooltip(tooltipContent, {
              sticky: true,
              className: 'info-tooltip'
            });
          
            // Hover styling events
            layer.on({
              mouseover: function (e) {
                e.target.setStyle(highlightStyle());
              },
              mouseout: function (e) {
                geojsonLayer.resetStyle(e.target);
              }
            });
          }
        }).addTo(map);

        // Fit map view tightly to the geographic bounds of the GeoJSON data
        map.fitBounds(geojsonLayer.getBounds());
      })
      .catch(error => {
        console.error('Error loading the river basin layer:', error);
      });
  </script>
</body>
</html>
